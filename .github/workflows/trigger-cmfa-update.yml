name: Trigger FlClash Update
on:
  workflow_dispatch:
  push:
    paths-ignore:
      - "docs/**"
      - "README.md"
      - ".github/ISSUE_TEMPLATE/**"
    branches:
      - FlClash
    tags:
      - "v*"
      
jobs:
  # Send "core-updated" to MetaCubeX/ClashMetaForAndroid to trigger update-dependencies
  trigger-CMFA-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: generate-token
        with:
          client-id: ${{ secrets.MAINTAINER_APPID }}
          private-key: ${{ secrets.MAINTAINER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      
      - name: Trigger update-dependencies
        run: |
          # 绕过 GitHub 限制：在主分支没文件时，通过创建 Tag 触发 push 事件执行特定分支工作流
          TOKEN="${{ steps.generate-token.outputs.token }}"
          
          # 1. 获取 dev-core 分支最新的 commit SHA (使用更通用的 commits API)
          SHA=$(curl -s -H "Authorization: Bearer $TOKEN" \
            https://api.github.com/repos/kafeixiang/FlClash/commits/dev-core | jq -r .sha)
          
          if [ "$SHA" == "null" ] || [ -z "$SHA" ]; then
            echo "Error: Could not get SHA for dev-core branch"
            exit 1
          fi

          # 2. 创建一个带时间戳的标签
          # 注意：这会触发目标仓库中配置了 on: push: tags: 'trigger-*' 的工作流
          curl -s -X POST -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/kafeixiang/FlClash/git/refs \
            -d "{\"ref\":\"refs/tags/trigger-$(date +%s)\",\"sha\":\"$SHA\"}"
